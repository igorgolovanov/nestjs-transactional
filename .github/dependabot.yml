version: 2
updates:
  # pnpm workspaces: Dependabot reads the root lockfile and opens one PR
  # per dependency across every workspace project, so the six packages,
  # the 19 examples and the root tooling are all covered by this entry.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # These move together and are only ever bumped as a set, so one PR
      # per group beats a dozen PRs that each fail until the others land.
      nestjs:
        patterns: ['@nestjs/*']
      jest:
        patterns: ['jest', 'ts-jest', '@types/jest']
      eslint:
        patterns: ['eslint', 'eslint-*', '@typescript-eslint/*', 'prettier']
    ignore:
      # The supported range is `^0.3.0 || ^1.0.0`, and which version the
      # lockfile pins is a deliberate decision tied to the CI matrix and
      # to what the examples declare — see the `examples` job in ci.yml.
      # A bot bumping this silently would break the matrix's meaning.
      - dependency-name: typeorm
      # `typeorm` declares `ioredis` as an optional peer at `^5.0.4`, and
      # `.npmrc` sets `auto-install-peers`, so pnpm materialises that peer
      # for every importer that pulls TypeORM. Because pnpm encodes peers
      # into package identity, an importer on a different major gets its
      # own `typeorm@x(ioredis@y)` instance — two `DataSource` classes,
      # and `getDataSourceToken()` uses the class itself as the DI token.
      # The install stays quiet about it (`strict-peer-dependencies` is
      # off) and the failure surfaces much later as an unresolvable
      # provider. Majors stay out until TypeORM widens the range; minors
      # and patches still come through.
      - dependency-name: ioredis
        update-types: ['version-update:semver-major']
      # The major here has to match `engines.node`, which every published
      # package sets to `>=22.11.0`. On @types/node 22 the compiler
      # refuses an API that Node 22 does not have; on 26 it accepts one
      # and the call fails at runtime for anyone honouring the declared
      # floor. Nothing else in CI covers that: `Type check` uses whatever
      # is installed, and the Node 22 test legs only notice an API a test
      # actually executes. Raise this together with `engines.node` and
      # `.nvmrc`, as a deliberate major, not as a bot bump.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Peer-range decisions, not upgrades. Widening a peer range is a
      # published-API change that needs a changeset and a compatibility
      # argument (ADR-004), which is not something to accept from a bot.
      - dependency-name: '@nestjs/cqrs'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nestjs/common'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nestjs/core'
        update-types: ['version-update:semver-major']
    commit-message:
      # Matches the Conventional Commits convention in CONTRIBUTING, so
      # commitlint does not reject the bot's own PRs.
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    ignore:
      # Every other action this repository uses appears in `ci.yml`, so a
      # bump is exercised by the pull request that proposes it.
      # `changesets/action` is the exception: it lives only in
      # `release.yml`, which runs on push to main, so its bumps land
      # green and break afterwards. v1 to v2 renamed every input and
      # output used here and failed six release runs before it was
      # noticed. Majors want a human reading the changelog; minors and
      # patches still come through.
      - dependency-name: changesets/action
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: ci
      include: scope
