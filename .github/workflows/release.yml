name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --filter './packages/*' build

      - name: Test
        run: pnpm -r --filter './packages/*' test

      # Duplicated from ci.yml on purpose. ci.yml gates pull requests;
      # this gates the publish itself, and those are not the same event —
      # a push straight to main, or a merge that landed without the
      # required checks configured, reaches this workflow without ci.yml
      # ever having passed.
      #
      # `publish:check` is the one that earns its place here rather than
      # only there: publint and attw inspect the *packed tarball*, which
      # is the artefact this job is about to push to npm. On the publish
      # run the versions have already been bumped, so they see exactly
      # what consumers will resolve. That check is how the `/testing`
      # subpath was found to be unresolvable under node10 resolution
      # after six releases had shipped it.
      - name: Verify the published surface and packaging
        run: |
          pnpm api:check
          pnpm publish:check

      # changesets/action will either:
      #   - open (or update) a "Version Packages" PR that bumps versions
      #     and writes CHANGELOG.md entries — when unreleased `.changeset/*.md`
      #     files are present on `main`.
      #   - publish to npm — when the "Version Packages" PR has just been
      #     merged and `.changeset/*.md` files are already consumed.
      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm release
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `actions/setup-node@v4` with `registry-url:` generates an
          # `.npmrc` that references `${NODE_AUTH_TOKEN}`. Both names
          # must point at the npm publish token — without
          # NODE_AUTH_TOKEN the .npmrc literal-expands to a placeholder
          # and `npm publish` 404s with "not in this registry".
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Post-publish dist-tag fix-up. `@changesets/cli publish` always
      # publishes under `latest` and refuses `--tag` in pre-release mode
      # (changesets/changesets#942), so we re-tag every just-published
      # pre-release as `alpha` here. `latest` stays on the freshest
      # version (changesets default) — fine while the cohort is alpha-only.
      #
      # Two guards keep this step from tagging stable versions as `alpha`
      # after `pnpm changeset pre exit`:
      #   1. `hashFiles('.changeset/pre.json') != ''` — primary gate: the
      #      file exists only while the cohort is in pre-release mode.
      #   2. Per-version skip on missing prerelease segment (no `-` in the
      #      semver) — safety net for mixed publishes or a misconfigured
      #      pre-exit.
      - name: Tag pre-releases as alpha
        if: steps.changesets.outputs.published == 'true' && hashFiles('.changeset/pre.json') != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          echo "$PUBLISHED" | jq -c '.[]' | while read -r pkg; do
            name=$(echo "$pkg" | jq -r '.name')
            version=$(echo "$pkg" | jq -r '.version')
            if [[ "$version" != *-* ]]; then
              echo "Skipping $name@$version — no prerelease segment, not tagging as alpha"
              continue
            fi
            echo "Tagging $name@$version as alpha"
            npm dist-tag add "$name@$version" alpha
          done
