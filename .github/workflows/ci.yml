name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-links:
    name: Doc links
    runs-on: ubuntu-latest
    # No pnpm install, no build: the check is plain shell over
    # `git ls-files`, so it runs in seconds and fails fast on a rotted
    # ADR/DD reference. Twenty had accumulated unnoticed before this
    # gate existed.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check relative markdown links
        run: ./scripts/check-doc-links.sh

  test-races:
    name: Test races
    runs-on: ubuntu-latest
    # Same shape as `doc-links`: plain Node over `git ls-files`, no
    # install and no build, so it fails in seconds. It catches integration
    # specs that wait on a handler flag or an emit mock and then assert a
    # publication's status, which the worker writes only after that call
    # returns. Three separate debugging sessions have gone into that one
    # mistake, including a green pull request that broke `main` once an
    # unrelated bump shifted the timing.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check integration specs for status races
        run: node ./scripts/check-test-races.js

  format:
    name: Format
    runs-on: ubuntu-latest
    # Single cell on purpose: Prettier's output does not vary by Node or
    # TypeORM version, so matrixing this would buy nothing.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Covers code, not prose: `packages/*/{src,test}/**/*.{ts,json}` plus the
      # root `package.json` and `pnpm-workspace.yaml`. Root markdown and
      # everything under docs/ is hand-wrapped and excluded in
      # .prettierignore — Prettier rewrites those rather than tidying them.
      - name: Check formatting
        run: pnpm format:check

  lint:
    name: Lint (Node ${{ matrix.node-version }}, TypeORM ${{ matrix.typeorm-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
        typeorm-version: ['0.3.31', '1.0.0', '1.1.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          # `1.1.0` is the version the lockfile pins, so that leg installs
          # frozen — it doubles as the check that the lockfile is in sync.
          # Every other point of the `^0.3.0 || ^1.0.0` peer range is forced
          # with a pnpm override, which wins over the declared devDependency.
          if [ "${{ matrix.typeorm-version }}" = "1.1.0" ]; then
            pnpm install --frozen-lockfile
          else
            npm pkg set 'pnpm.overrides.typeorm=${{ matrix.typeorm-version }}'
            pnpm install --no-frozen-lockfile
          fi

      # The override is a silent mechanism: pnpm 10 stopped reading
      # `pnpm.overrides` from package.json, and when it is ignored the leg
      # quietly installs the lockfile version and still passes — claiming a
      # compatibility we never tested. Assert what actually landed.
      - name: Verify the TypeORM version under test
        run: |
          actual=$(node -p "require('./packages/typeorm/node_modules/typeorm/package.json').version")
          if [ "$actual" != "${{ matrix.typeorm-version }}" ]; then
            echo "::error::expected typeorm ${{ matrix.typeorm-version }}, resolved $actual"
            exit 1
          fi
          echo "typeorm $actual"

      # Cross-package type resolution goes through `dist/*.d.ts`
      # (each package.json's `types` field). ESLint's
      # `projectService: true` parser needs those resolved or it
      # surfaces every cross-package import as "Unsafe call of a
      # type that could not be resolved". Build first.
      - name: Build
        run: pnpm -r --filter './packages/*' build

      - name: Lint
        run: pnpm -r --filter './packages/*' lint

      # The examples are applications on the lockfile's TypeORM, not code
      # that has to hold across the peer range, so one leg per Node
      # version lints them.
      - name: Lint examples
        if: matrix.typeorm-version == '1.1.0'
        run: pnpm -r --filter './examples/*' lint

  build:
    name: Build (Node ${{ matrix.node-version }}, TypeORM ${{ matrix.typeorm-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
        typeorm-version: ['0.3.31', '1.0.0', '1.1.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          # `1.1.0` is the version the lockfile pins, so that leg installs
          # frozen — it doubles as the check that the lockfile is in sync.
          # Every other point of the `^0.3.0 || ^1.0.0` peer range is forced
          # with a pnpm override, which wins over the declared devDependency.
          if [ "${{ matrix.typeorm-version }}" = "1.1.0" ]; then
            pnpm install --frozen-lockfile
          else
            npm pkg set 'pnpm.overrides.typeorm=${{ matrix.typeorm-version }}'
            pnpm install --no-frozen-lockfile
          fi

      # The override is a silent mechanism: pnpm 10 stopped reading
      # `pnpm.overrides` from package.json, and when it is ignored the leg
      # quietly installs the lockfile version and still passes — claiming a
      # compatibility we never tested. Assert what actually landed.
      - name: Verify the TypeORM version under test
        run: |
          actual=$(node -p "require('./packages/typeorm/node_modules/typeorm/package.json').version")
          if [ "$actual" != "${{ matrix.typeorm-version }}" ]; then
            echo "::error::expected typeorm ${{ matrix.typeorm-version }}, resolved $actual"
            exit 1
          fi
          echo "typeorm $actual"

      - name: Build
        run: pnpm -r --filter './packages/*' build

  test:
    name: Test (Node ${{ matrix.node-version }}, TypeORM ${{ matrix.typeorm-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
        typeorm-version: ['0.3.31', '1.0.0', '1.1.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          # `1.1.0` is the version the lockfile pins, so that leg installs
          # frozen — it doubles as the check that the lockfile is in sync.
          # Every other point of the `^0.3.0 || ^1.0.0` peer range is forced
          # with a pnpm override, which wins over the declared devDependency.
          if [ "${{ matrix.typeorm-version }}" = "1.1.0" ]; then
            pnpm install --frozen-lockfile
          else
            npm pkg set 'pnpm.overrides.typeorm=${{ matrix.typeorm-version }}'
            pnpm install --no-frozen-lockfile
          fi

      # The override is a silent mechanism: pnpm 10 stopped reading
      # `pnpm.overrides` from package.json, and when it is ignored the leg
      # quietly installs the lockfile version and still passes — claiming a
      # compatibility we never tested. Assert what actually landed.
      - name: Verify the TypeORM version under test
        run: |
          actual=$(node -p "require('./packages/typeorm/node_modules/typeorm/package.json').version")
          if [ "$actual" != "${{ matrix.typeorm-version }}" ]; then
            echo "::error::expected typeorm ${{ matrix.typeorm-version }}, resolved $actual"
            exit 1
          fi
          echo "typeorm $actual"

      # ts-jest resolves `@nestjs-transactional/*` cross-package
      # imports through the package.json `types` / `main` paths,
      # which point at `dist/`. Without a build step a fresh
      # checkout fails with `TS2307: Cannot find module
      # '@nestjs-transactional/core'`.
      - name: Build
        run: pnpm -r --filter './packages/*' build

      - name: Test
        run: pnpm -r --filter './packages/*' test

  coverage:
    name: Coverage (Node 22, TypeORM 1.1)
    runs-on: ubuntu-latest
    # Single cell on purpose: coverage does not vary by Node or TypeORM
    # version, and the `test` job already proves the suite passes across
    # the full matrix. What this job adds is the per-package
    # `coverageThreshold` gate — the enforcement behind the "coverage has
    # not dropped below baseline" quality gate, which was previously
    # unverifiable in CI.
    #
    # `typeorm` measures coverage through `jest.coverage.config.js`, which
    # includes its testcontainers suites, so this job needs Docker and
    # takes about as long as the integration job. That cost buys numbers
    # that mean something: unit tests alone under-report an adapter whose
    # behaviour only shows against a real database.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --filter './packages/*' build

      # Fails when any package drops below its baseline floor, and — with
      # `passWithNoTests` gone — when a package ships no unit tests at all.
      - name: Test with coverage
        run: pnpm -r --filter './packages/*' test:cov

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: packages/*/coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  type-check:
    name: Type check (TypeORM ${{ matrix.typeorm-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typeorm-version: ['0.3.31', '1.0.0', '1.1.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          # `1.1.0` is the version the lockfile pins, so that leg installs
          # frozen — it doubles as the check that the lockfile is in sync.
          # Every other point of the `^0.3.0 || ^1.0.0` peer range is forced
          # with a pnpm override, which wins over the declared devDependency.
          if [ "${{ matrix.typeorm-version }}" = "1.1.0" ]; then
            pnpm install --frozen-lockfile
          else
            npm pkg set 'pnpm.overrides.typeorm=${{ matrix.typeorm-version }}'
            pnpm install --no-frozen-lockfile
          fi

      # The override is a silent mechanism: pnpm 10 stopped reading
      # `pnpm.overrides` from package.json, and when it is ignored the leg
      # quietly installs the lockfile version and still passes — claiming a
      # compatibility we never tested. Assert what actually landed.
      - name: Verify the TypeORM version under test
        run: |
          actual=$(node -p "require('./packages/typeorm/node_modules/typeorm/package.json').version")
          if [ "$actual" != "${{ matrix.typeorm-version }}" ]; then
            echo "::error::expected typeorm ${{ matrix.typeorm-version }}, resolved $actual"
            exit 1
          fi
          echo "typeorm $actual"

      # Per-package `tsc --noEmit` resolves cross-package imports
      # via `node_modules/@nestjs-transactional/*/dist/*.d.ts`.
      # Without a build, type-check sees only stale `.ts` source
      # without declaration outputs and bails on the first
      # cross-package import.
      - name: Build
        run: pnpm -r --filter './packages/*' build

      - name: Type check
        run: pnpm -r --filter './packages/*' exec tsc --noEmit

  test-integration:
    name: Integration tests (Node 22, TypeORM ${{ matrix.typeorm-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typeorm-version: ['0.3.31', '1.0.0', '1.1.0']
    # ubuntu-latest ships with Docker, and testcontainers spins up Postgres
    # per suite. `typeorm` and `outbox` define `test:integration`; pnpm
    # filter-run skips packages without it. The outbox suite belongs in
    # this matrix: what it exercises is `@nestjs/outbox`'s TypeORM
    # executor joining the transaction `@Transactional` opened.
    #
    # The outbox's broker suite is a separate script, `test:brokers`, and
    # runs in its own job below. Running it here would start two brokers
    # three times for one signal, under a job label naming a TypeORM
    # version that has nothing to do with the result.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          # `1.1.0` is the version the lockfile pins, so that leg installs
          # frozen — it doubles as the check that the lockfile is in sync.
          # Every other point of the `^0.3.0 || ^1.0.0` peer range is forced
          # with a pnpm override, which wins over the declared devDependency.
          if [ "${{ matrix.typeorm-version }}" = "1.1.0" ]; then
            pnpm install --frozen-lockfile
          else
            npm pkg set 'pnpm.overrides.typeorm=${{ matrix.typeorm-version }}'
            pnpm install --no-frozen-lockfile
          fi

      # The override is a silent mechanism: pnpm 10 stopped reading
      # `pnpm.overrides` from package.json, and when it is ignored the leg
      # quietly installs the lockfile version and still passes — claiming a
      # compatibility we never tested. Assert what actually landed.
      - name: Verify the TypeORM version under test
        run: |
          actual=$(node -p "require('./packages/typeorm/node_modules/typeorm/package.json').version")
          if [ "$actual" != "${{ matrix.typeorm-version }}" ]; then
            echo "::error::expected typeorm ${{ matrix.typeorm-version }}, resolved $actual"
            exit 1
          fi
          echo "typeorm $actual"

      - name: Build
        run: pnpm -r --filter './packages/*' build

      - name: Integration tests
        run: pnpm -r --filter './packages/*' test:integration

  nest-11:
    name: NestJS 11 and @nestjs/cqrs 11 (Node 22)
    runs-on: ubuntu-latest
    # The lockfile pins NestJS 12 and @nestjs/cqrs 12.1, so every other
    # job tests the top of the `^11 || ^12` peer range. This one forces
    # the bottom with pnpm overrides, the same mechanism as the TypeORM
    # matrix. The cqrs package reaches into EventBus and AggregateRoot,
    # whose behaviour changed between 11.0 and 12.1, so it is the
    # package this leg mostly exists for.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          for pkg in common core testing microservices platform-express; do
            npm pkg set "pnpm.overrides.@nestjs/$pkg=^11.1.0"
          done
          npm pkg set 'pnpm.overrides.@nestjs/cqrs=11.0.3'
          pnpm install --no-frozen-lockfile

      # Overrides fail silently when pnpm ignores them; see the TypeORM
      # matrix above. Assert what actually landed.
      - name: Verify the NestJS versions under test
        run: |
          core=$(node -p "require('./packages/cqrs/node_modules/@nestjs/core/package.json').version")
          cqrs=$(node -p "require('./packages/cqrs/node_modules/@nestjs/cqrs/package.json').version")
          case "$core" in 11.*) ;; *) echo "::error::expected @nestjs/core 11, resolved $core"; exit 1 ;; esac
          if [ "$cqrs" != "11.0.3" ]; then
            echo "::error::expected @nestjs/cqrs 11.0.3, resolved $cqrs"
            exit 1
          fi
          echo "@nestjs/core $core, @nestjs/cqrs $cqrs"

      - name: Build
        run: pnpm -r --filter './packages/*' build

      - name: Type check
        run: pnpm -r --filter './packages/*' exec tsc --noEmit

      - name: Unit tests
        run: pnpm -r --filter './packages/*' test

      - name: Integration tests
        run: pnpm -r --filter './packages/*' test:integration

  broker-integration:
    name: Broker integration tests (Kafka, RabbitMQ)
    runs-on: ubuntu-latest
    # Single cell: the question this job answers is what a real broker's
    # acknowledgement means for an outbox message, delivered and removed
    # or kept for a retry, which does not vary by Node or TypeORM
    # version. About 40 seconds for both brokers.
    #
    # This job exists because the answer was once recorded wrong. ADR-016
    # concluded from a failing experiment that `emit()` cannot report
    # broker failures, deleted this suite, and left a "silent success"
    # limitation in the published README that was not true. Re-measuring
    # it is cheap; leaving it unmeasured cost a user-facing false
    # statement that stood for months. See ADR-021.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --filter './packages/*' build

      - name: Integration tests
        run: pnpm --filter @nestjs-transactional/outbox test:brokers

  api-surface:
    name: API surface
    runs-on: ubuntu-latest
    # Single cell: the report is generated from the built `.d.ts`, which does
    # not vary by Node version. It does vary by TypeORM version — the adapter
    # packages re-export TypeORM types — so this runs on the version the
    # lockfile pins, the same one the published packages are built against.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # api-extractor reads `dist/index.d.ts`, so the declarations have to
      # exist before it can diff anything.
      - name: Build packages
        run: pnpm -r --filter './packages/*' build

      # Fails when the built surface differs from the committed report in
      # packages/*/etc/*.api.md. ADR-004 promises API stability; this is what
      # turns that promise into a reviewable diff instead of something a
      # reviewer has to notice. Run `pnpm api:update` to accept a change.
      - name: Check the public API surface
        run: pnpm api:check

  publish-check:
    name: Publishing correctness
    runs-on: ubuntu-latest
    # Answers the question the other jobs cannot: not "do the sources
    # compile" but "does what we ship resolve for a consumer". publint reads
    # the packed tarball's manifest; attw resolves every entry point under
    # node10, node16 (from CJS and from ESM) and bundler.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Both tools pack each package, so dist/ has to exist first.
      - name: Build packages
        run: pnpm -r --filter './packages/*' build

      - name: Check publishing correctness
        run: pnpm publish:check

  examples:
    name: Examples (Node 22, TypeORM 1.1)
    runs-on: ubuntu-latest
    # Deliberately NOT on the TypeORM matrix the jobs above use. The
    # examples declare `typeorm ^1.1.0`, and the override those legs apply
    # is repo-wide: forcing 0.3.31 onto an example that asks for ^1.1.0
    # puts two TypeORM copies in one workspace, and since
    # `getDataSourceToken()` returns the `DataSource` class itself for the
    # default source, the example then registers one copy's class and the
    # adapter looks up the other's. Peer-range coverage is the matrix
    # above's job; this one answers a different question — does an ordinary
    # consumer app still build and run against the library as it stands?
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Examples consume the packages through `workspace:*` links and
      # type-check against their `dist/*.d.ts`, so the library has to be
      # built before anything under `examples/` compiles.
      - name: Build packages
        run: pnpm -r --filter './packages/*' build

      - name: Build examples
        run: pnpm -r --filter './examples/*' build

      - name: Test examples
        run: pnpm -r --filter './examples/*' test

      # Same testcontainers Postgres the library's integration job uses. The
      # externalization examples stub the broker rather than starting Kafka
      # or RabbitMQ, so their `docker-compose.yml` is for `pnpm start` demos
      # only and no broker is needed here. Five examples define no
      # `test:integration`; pnpm filter-run skips them.
      - name: Integration tests
        run: pnpm -r --filter './examples/*' test:integration
